services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    working_dir: /workspaces/shiny-rock-chat
    environment:
      DATABASE_URL: postgres://shinyrock:shinyrock-dev@db:5432/shinyrock?sslmode=disable
      TURN_URL: turn:turn:3478
      TURN_USERNAME: dev
      TURN_PASSWORD: dev-only-change-me
    volumes:
      - .:/workspaces/shiny-rock-chat:cached
      - flutter-pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle
      - go-module-cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
      turn:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shinyrock
      POSTGRES_USER: shinyrock
      POSTGRES_PASSWORD: shinyrock-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinyrock -d shinyrock"]
      interval: 5s
      timeout: 5s
      retries: 10

  turn:
    image: coturn/coturn:4.6
    command:
      - -n
      - --log-file=stdout
      - --realm=localhost
      - --user=dev:dev-only-change-me
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --lt-cred-mech
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  flutter-pub-cache:
  gradle-cache:
  go-module-cache:
  postgres-data:
